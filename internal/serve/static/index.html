<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEdit — YAML config editor</title>
<script>
/* apply theme before first paint to avoid a flash: localStorage wins,
   else follow the OS preference */
(function () {
  try {
    var saved = localStorage.getItem("wedit-theme");
    var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">W</span>
    <div class="brand-text">
      <h1>WEdit</h1>
      <p id="config-path">—</p>
    </div>
  </div>
  <div class="header-right">
    <button id="theme-toggle" class="icon-btn" title="Toggle light/dark theme">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
    </button>
    <span id="dirty-indicator" class="dirty hidden">modified</span>
    <span id="save-status" class="save-status"></span>
    <button id="save-btn" class="btn primary" title="Validate + write config + staged SQL to disk">Save</button>
  </div>
</header>
<div class="layout">
  <nav id="tabs"></nav>
  <main id="content">
    <div class="placeholder">Loading config…</div>
  </main>
</div>
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span id="modal-title"></span>
      <button id="modal-close" class="btn small">✕</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn">Cancel</button>
      <button id="modal-ok" class="btn primary">OK</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
